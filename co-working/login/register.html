<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create account | CoWork Hub</title>
    <link rel="stylesheet" href="register.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="icon" href="../images/Co work hub.png"/>
</head>

<body>
    <main class="page">
        <section class="card" aria-labelledby="register-title">
            <a class="brand" href="../homepage/index.html"><i class="ri-building-4-line"></i> CoWork<span>Hub</span></a>
            <h1 id="register-title">Create your account</h1>
            <p class="subtext">Join CoWork Hub and start booking your ideal workspace.</p>

            <form id="registerForm">
                <label for="name">Full name</label>
                <div class="input"><i class="ri-user-line"></i><input id="name" type="text"
                        placeholder="Enter your full name" autocomplete="name" required></div>

                <label for="email">Email address</label>
                <div class="input"><i class="ri-mail-line"></i><input id="email" type="email"
                        placeholder="abc@gmail.com" autocomplete="email" required></div>

                <label for="password">Password</label>
                <div class="input"><i class="ri-lock-line"></i><input id="password" type="password"
                        placeholder="At least 6 characters" autocomplete="new-password" minlength="6" required><button
                        class="eye" type="button" data-password="password" aria-label="Show password"><i
                            class="ri-eye-line"></i></button></div>

                <label for="confirmPassword">Confirm password</label>
                <div class="input"><i class="ri-lock-line"></i><input id="confirmPassword" type="password"
                        placeholder="Re-enter your password" autocomplete="new-password" minlength="6" required><button
                        class="eye" type="button" data-password="confirmPassword" aria-label="Show password"><i
                            class="ri-eye-line"></i></button></div>

                <label class="agree"><input type="checkbox" required> I agree to the <a href="#">Terms of Service</a>
                    and <a href="#">Privacy Policy</a>.</label>
                <button class="button" type="submit">Create account <i class="ri-arrow-right-line"></i></button>
                <p id="message" class="msg" aria-live="polite"></p>
            </form>
            <p class="login">Already have an account? <a href="login.html">Login</a></p>
        </section>
    </main>
    <script src="register.js"></script>
</body>

</html>
